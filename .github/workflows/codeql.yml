# CodeQL Analysis Workflow
# Runs CodeQL static analysis on every push and PR
# See https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning

name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1b549b9259bda1b5cc3c8f81c7c8d5f0a7c8c5c5 # v3.28.0
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config-file: ./.github/codeql-config.yml

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.0.4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript (if applicable)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1b549b9259bda1b5cc3c8f81c7c8d5f0a7c8c5c5 # v3.28.0
        with:
          category: "/language:${{matrix.language}}"
          upload: true

  analyze-bot:
    name: Analyze Bot (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1b549b9259bda1b5cc3c8f81c7c8d5f0a7c8c5c5 # v3.28.0
        with:
          languages: javascript
          queries: +security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.0.4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bot-wa/package-lock.json

      - name: Install Bot dependencies
        run: npm ci
        working-directory: bot-wa

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1b549b9259bda1b5cc3c8f81c7c8d5f0a7c8c5c5 # v3.28.0
        with:
          category: "/language:javascript/bot"
          upload: true