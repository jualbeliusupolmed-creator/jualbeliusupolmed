name = "kampuskita"
main = "worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = ["/linusku/sw.js"]
html_handling = "none"
not_found_handling = "none"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "kampuskita"

[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "0af537571f424ca19a67a2ebfd8babe0"

[triggers]
crons = [
  "0 8 * * *",
  "0 0 * * *",
  "0 6 * * *",
  "0 1,2,3 * * *",
]

[vars]
NEXTJS_ENV = "production"
NEXT_PUBLIC_BASE_URL = "https://www.kampuskita.my.id"
