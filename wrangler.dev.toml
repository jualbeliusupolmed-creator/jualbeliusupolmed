name = "kampuskita-redesign-dev"
main = "worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = ["/linusku/sw.js"]
html_handling = "none"
not_found_handling = "none"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "kampuskita-redesign-dev"

[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "6af2da67d7424d52be2d0c31f57cf457"

[vars]
NEXTJS_ENV = "production"
NEXT_PRIVATE_MINIMAL_MODE = "1"
IMAGE_PROCESSOR_RUNTIME = "workerd"
NEXT_PUBLIC_BASE_URL = "https://kampuskita-redesign-dev.invalid"
NEXT_PUBLIC_SITE_URL = "https://kampuskita-redesign-dev.invalid"
NEXT_PUBLIC_SUPABASE_URL = "https://kampuskita-dev.invalid"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "development-backend-not-configured"
NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "development-backend-not-configured"
